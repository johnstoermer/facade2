<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Facade 2</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: #000; color: #eee; font: 14px system-ui; }
  body { display: grid; grid-template-rows: minmax(0, 1fr); }
  main { min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; container-type: size; }
  .game-surface { position: relative; width: min(100cqw, calc(100cqh * 1016 / 734)); aspect-ratio: 1016 / 734; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  [hidden] { display: none !important; }
  .game-hud { position: absolute; inset: 0; pointer-events: none; font-family: 'Comic Sans MS', cursive, sans-serif; font-weight: bold; }
  .game-hud button, .game-hud meter { pointer-events: auto; }
  button { color: #9cf; background: #222e; border: 1px solid #9997; border-radius: 2px; padding: 5px 9px; font: inherit; cursor: pointer; }
  button:hover, button:focus-visible { color: #ffffe5; border-color: #ffffe5; outline: 1px solid #ffffe5; }
  .game-hud button { min-height: 32px; background: #2229; border-color: transparent; text-shadow: 1px 1px #000; }
  #game-menu-button { position: absolute; right: 8px; top: 8px; }
  .play-controls, .start-controls { position: absolute; right: 8px; bottom: 8px; display: flex; align-items: center; gap: 3px; }
  .draft-controls { position: absolute; right: 8px; bottom: 48px; display: flex; align-items: center; gap: 4px; font-size: 12px; text-shadow: 1px 1px #000; }
  #status { position: absolute; top: 12px; left: 10px; width: calc(100% - 85px); font: bold 12px/1.35 'Comic Sans MS', cursive, sans-serif; overflow-wrap: anywhere; text-shadow: 1px 1px #000, -1px -1px #000; }
  #mic-level { width: 20px; height: 10px; }
  button[aria-pressed=true] { border-color: #f5de65; color: #f5de65; }
  dialog { width: min(410px, calc(100vw - 16px)); max-width: none; max-height: none; padding: 10px; border: 1px solid #888; border-radius: 2px; background: #292929f5; color: #eee; font: bold 14px/1.3 'Comic Sans MS', cursive, sans-serif; }
  dialog::backdrop { background: #0009; }
  .dialog-header, .selector, .dialog-actions { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .dialog-header { margin-bottom: 6px; }
  dialog p { margin: 6px 0; font-size: 13px; }
  dialog form { margin: 0; }
  .selector { margin: 6px 0; }
  .selector span { min-width: 0; text-align: center; overflow-wrap: anywhere; font-size: 13px; }
  .selector button { flex: 0 0 auto; }
  #character-voice-mode, #dialogue-model { width: 100%; color: inherit; background: #222; border: 1px solid #777; padding: 5px; font: inherit; }
  #voice-state { overflow-wrap: anywhere; }
  #prepare-progress { display: block; width: 100%; height: 12px; accent-color: #f5de65; }
  #prepare-detail { font-size: 12px; }
  #prepare-dialog .dialog-actions { justify-content: flex-end; }
  #talk-text { display: block; resize: none; width: 100%; height: 64px; margin: 6px 0; padding: 3px; border: 1px solid #777; background: #080808; color: #eee; font: 16px/18px monospace; }
  #game-menu { width: min(270px, calc(100vw - 16px)); }
  .menu-options { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #movement { display: none; position: absolute; left: 8px; bottom: 8px; grid-template-columns: 32px 32px; gap: 2px; }
  #movement button { padding: 4px; touch-action: none; }
  @media (pointer: coarse) { body.playing #movement { display: grid; } }
  @media (max-height: 240px) { dialog { padding: 6px; } dialog p { margin: 4px 0; } .dialog-header { margin-bottom: 4px; } }
</style>
<main><div class="game-surface"><canvas id="game" width="1016" height="734" tabindex="0" aria-label="Facade 2 apartment scene. WASD moves, left and right arrows turn. Enter opens typing."></canvas><canvas id="ui" width="1016" height="734" aria-hidden="true"></canvas>
<div class="game-hud" aria-label="Game controls">
 <span id="status" role="status">Loading scene…</span><button id="game-menu-button" type="button" aria-haspopup="dialog">Menu</button>
 <span id="movement" aria-label="Movement"><button type="button" data-key="ArrowLeft" aria-label="Turn left">←</button><button type="button" data-key="ArrowUp" aria-label="Move forward">↑</button><button type="button" data-key="ArrowDown" aria-label="Move backward">↓</button><button type="button" data-key="ArrowRight" aria-label="Turn right">→</button></span>
 <span class="start-controls"><button id="previous-name" type="button" aria-label="Previous name" hidden>‹</button><button id="voice" type="button" aria-pressed="false" disabled>Start</button><button id="next-name" type="button" aria-label="Next name" hidden>›</button></span>
 <span class="play-controls"><button id="talk-button" type="button" title="Enter to type" hidden>Talk</button><button id="mic-button" type="button" aria-pressed="false" hidden>Mic</button><meter id="mic-level" min="0" max="1" value="0" aria-label="Microphone input level" hidden></meter><button id="stop-reply" type="button" hidden>Stop</button></span>
 <span id="draft-pages" class="draft-controls" aria-label="Typed message pages" hidden><button id="previous-draft" type="button" aria-label="Previous typed-message page">‹</button><span id="draft-page" aria-live="polite"></span><button id="next-draft" type="button" aria-label="Next typed-message page">›</button></span>
</div></div></main>
<dialog id="game-menu" aria-labelledby="game-menu-title">
 <div class="dialog-header"><strong id="game-menu-title">Facade 2</strong><button id="game-menu-close" type="button">Back</button></div>
 <div class="menu-options"><button id="dialogue-button" type="button">Dialogue</button><button id="character-voice-button" type="button" hidden>Voice</button><button id="reset" type="button">Restart</button></div>
 <p>WASD move · ← → turn<br>Enter to talk</p>
</dialog>
<dialog id="dialogue-dialog" aria-labelledby="dialogue-title">
  <div class="dialog-header"><strong id="dialogue-title">Local dialogue</strong><button id="dialogue-close" type="button">Close</button></div>
  <select id="dialogue-model" aria-label="Local dialogue model"><option value="recordings">Original recordings only</option><option value="Qwen3.5-4B-q4f16_1-MLC">Qwen3.5 4B · ~2.4 GB</option><option value="Qwen3.5-9B-q4f16_1-MLC">Qwen3.5 9B · ~5.1 GB</option></select>
  <p id="dialogue-state" role="status">Downloads once, then runs here.</p>
  <label><input id="idle-behavior" type="checkbox" checked> Initiate while idle</label>
</dialog>
<dialog id="prepare-dialog" aria-labelledby="prepare-title" aria-describedby="prepare-stage">
  <div class="dialog-header"><strong id="prepare-title">Facade 2</strong></div>
  <p id="prepare-stage" role="status">Preparing local models</p>
  <progress id="prepare-progress" value="0" max="6" aria-label="Local model preparation"></progress>
  <p id="prepare-detail">Cached files are reused.</p>
  <div class="dialog-actions"><button id="prepare-retry" type="button" hidden>Retry</button><button id="prepare-cancel" type="button">Cancel</button><button id="prepare-recordings" type="button">Use recordings</button></div>
</dialog>
<dialog id="talk-dialog" aria-labelledby="talk-title">
  <div class="dialog-header"><strong id="talk-title">Talk to Trip or Grace</strong><button id="talk-close" type="button" aria-label="Close typing">Close</button></div>
  <form id="talk-form"><textarea id="talk-text" rows="3" maxlength="80" aria-label="Your words" spellcheck="false" autocomplete="off"></textarea><button type="submit">Say it</button></form>
</dialog>
<dialog id="character-voice-dialog" aria-labelledby="character-voice-title">
  <div class="dialog-header"><strong id="character-voice-title">Character voices</strong><button id="character-voice-close" type="button">Close</button></div>
  <select id="character-voice-mode" aria-label="Local character voice model"><option value="turbo">Turbo · ~0.8 GB</option><option value="standard">Standard · 0.94 GB</option><option value="captions">Captions only</option></select>
  <p id="voice-state" role="status">Loads with the first reply.</p>
  <p id="voice-note">Startup ~10 s. Files are cached here.</p>
</dialog>
<script type="module" src="./scene.js"></script>
</html>
